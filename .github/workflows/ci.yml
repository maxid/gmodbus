name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...
      - name: Interop tests
        working-directory: interop
        run: go test ./...
      - name: Interop vet
        working-directory: interop
        run: go vet ./...

  # A client serializes callers on one wire and a server answers many connections
  # at once, so the race detector is where a session, deadline or store bug shows
  # up first. Ubuntu only — one platform runs it meaningfully, and three would
  # triple the slowest job in the matrix.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Test with the race detector
        run: go test -race ./...

  # A short fuzz run over the two parsers a peer controls: the ADU the master
  # decodes (MBAP and CRC-framed RTU) and the PDU the server dispatches. Ten
  # seconds each catches the cheap crashes — index out of range, unbounded
  # allocation, a frame that decodes but does not re-encode — without turning CI
  # into a fuzzing farm; a longer run is a local or nightly job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Fuzz the application data unit
        run: go test . -run '^$' -fuzz FuzzDecodeADU -fuzztime 10s
      - name: Fuzz the PDU
        run: go test . -run '^$' -fuzz FuzzDecodePDU -fuzztime 10s

  # The interop module's integration matrix: pymodbus on both sides of this
  # library (a slave in a container for our client, the reference client against
  # our server) plus RTU over a pseudo-terminal pair. Docker is why none of it
  # belongs in the default `go test ./...`; every case skips when the daemon is
  # missing, but a release gate has to run them somewhere. Ubuntu only.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Vet the integration build
        working-directory: interop
        run: go vet -tags=integration ./...
      - name: Reference implementations and the serial link
        working-directory: interop
        run: go test -tags=integration -timeout 20m -v ./...
